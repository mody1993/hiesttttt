name: WOLF Hunting Bots

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # يتيح لك تشغيل وإيقاف البوت يدوياً من تبويب Actions
  schedule:
    - cron: '0 */5 * * *' # إعادة تشغيل البوت تلقائياً كل 5 ساعات لتفادي توقف GitHub Actions

jobs:
  run-bots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # استخدام الإصدار المستقر الحديث لتجنب التحذيرات

      - name: Install Dependencies
        run: npm install

      - name: Run WOLF Bots
        timeout-minutes: 350 # إبقاء التشغيل حتى 5 ساعات ونصف تقريباً قبل التدوير
        env:
          U_TOKEN_1: ${{ secrets.U_TOKEN_1 }}
          U_TOKEN_2: ${{ secrets.U_TOKEN_2 }}
          U_TOKEN_3: ${{ secrets.U_TOKEN_3 }}
          U_TOKEN_4: ${{ secrets.U_TOKEN_4 }}
          U_TOKEN_5: ${{ secrets.U_TOKEN_5 }}
          U_TOKEN_6: ${{ secrets.U_TOKEN_6 }}
          U_TOKEN_7: ${{ secrets.U_TOKEN_7 }}
          U_TOKEN_8: ${{ secrets.U_TOKEN_8 }}
          U_TOKEN_9: ${{ secrets.U_TOKEN_9 }}
          U_TOKEN_10: ${{ secrets.U_TOKEN_10 }}
          U_TOKEN_11: ${{ secrets.U_TOKEN_11 }}
          U_TOKEN_12: ${{ secrets.U_TOKEN_12 }}
        run: node index.js
